<title>Advisory + A Trinca Publicidade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: faixa escura de capa; páginas em grade de cartões; planilhas em lista compacta; apoio no fim */
:root{
  --paper:#EEF1F0; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#121921; --ink-2:#333E48; --muted:#56606A;
  --line:#D6DCDB; --line-2:#E5E9E8; --accent:#2B4C7E; --accent-2:#1E3759; --accent-soft:#E3E9F3;
  --ok:#1B6E45; --ok-soft:#DFEDE6; --new:#8A5D06; --new-soft:#F4EBD6;
  --capa:#121921; --capa-ink:#F4F6F5; --capa-ink-2:#A8B4BC; --capa-accent:#9BBDEC; --capa-line:#2A343D;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1317; --surface:#171E25; --surface-2:#1B232A; --ink:#EEF2F2; --ink-2:#C2CBCE; --muted:#A3AFB6;
  --line:#2B353D; --line-2:#222B32; --accent:#8CB2E6; --accent-2:#B0CBF0; --accent-soft:#1B2A3B;
  --ok:#5FB888; --ok-soft:#15271E; --new:#DBA845; --new-soft:#2A2314;
  --capa:#1A232B; --capa-ink:#EEF2F2; --capa-ink-2:#A6B2B9; --capa-accent:#8CB2E6; --capa-line:#2D3942; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1317; --surface:#171E25; --surface-2:#1B232A; --ink:#EEF2F2; --ink-2:#C2CBCE; --muted:#A3AFB6;
  --line:#2B353D; --line-2:#222B32; --accent:#8CB2E6; --accent-2:#B0CBF0; --accent-soft:#1B2A3B;
  --ok:#5FB888; --ok-soft:#15271E; --new:#DBA845; --new-soft:#2A2314;
  --capa:#1A232B; --capa-ink:#EEF2F2; --capa-ink-2:#A6B2B9; --capa-accent:#8CB2E6; --capa-line:#2D3942; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.in{max-width:1000px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase}

.capa{background:var(--capa);color:var(--capa-ink)}
.capa .in{padding-block:36px 32px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:22px 40px}
.capa .eyebrow{color:var(--capa-accent)}
.capa h1{font-size:clamp(30px,5vw,46px);font-weight:800;line-height:1.02;margin-top:10px}
.capa p{margin:10px 0 0;color:var(--capa-ink-2);max-width:52ch}
.capa dl{display:flex;margin:0}
.capa dl div{padding:0 20px;border-left:1px solid var(--capa-line)}
.capa dl div:first-child{padding-left:0;border-left:none}
.capa dt{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--capa-ink-2)}
.capa dd{margin:4px 0 0;font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}

main.in{padding-block:34px 56px;display:flex;flex-direction:column;gap:40px}
.head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px 18px;padding-bottom:11px;margin-bottom:18px;border-bottom:2px solid var(--ink)}
.head h2{font-size:21px;font-weight:700}
.head .conta{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* cartões das páginas */
.grade{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
a.card{display:flex;align-items:center;gap:15px;text-decoration:none;color:inherit;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:17px 18px;transition:border-color .15s,transform .15s,box-shadow .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px -10px rgba(18,25,33,.35)}
a:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ini{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2);
  font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.02em}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nome{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2}
.marca{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.seta{flex:none;font-family:var(--display);font-size:20px;color:var(--muted);transition:color .15s,transform .15s}
a.card:hover .seta,a.row:hover .seta{color:var(--accent);transform:translateX(3px)}

/* lista das planilhas e apoio */
.lista{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
a.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:6px 22px;padding:15px 18px;text-decoration:none;color:inherit;border-top:1px solid var(--line-2)}
a.row:first-child{border-top:none}
a.row:hover{background:var(--surface-2)}
.row .txt .prog{font-size:13.5px;color:var(--muted)}
.datas{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:var(--ok-soft);color:var(--ok);margin-right:8px}
.pill.new{background:var(--new-soft);color:var(--new)}
@media (max-width:620px){a.row{grid-template-columns:1fr auto}.row .datas{grid-column:1;grid-row:2}.row .seta{grid-row:1/3;grid-column:2}}

.status{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:-6px 0 14px;font-size:13px;color:var(--muted)}
.btn{font:inherit;font-weight:600;font-size:13px;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:6px;padding:5px 12px;cursor:pointer}
footer{border-top:1px solid var(--line);padding-top:15px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}a.card:hover{transform:none}}

/* cartão de cliente com dois links */
.cli{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:17px 18px}
.cli .topo{display:flex;align-items:center;gap:15px}
.cli .prog{font-size:13px;color:var(--muted);line-height:1.4}
.cli .linha{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.acoes a,.acoes span{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:600;font-size:13.5px;border-radius:7px;padding:9px 10px;text-align:center}
.acoes a.pag{background:var(--accent);color:var(--surface)}
.acoes a.pag:hover{background:var(--accent-2)}
.acoes a.pla{border:1px solid var(--accent);color:var(--accent)}
.acoes a.pla:hover{background:var(--accent-soft)}
.acoes span.falta{border:1px dashed var(--line);color:var(--muted);font-weight:500}
.pill.fim{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
</style>

<header class="capa">
  <div class="in">
    <div>
      <div class="eyebrow">Jota Co</div>
      <h1>Advisory + A Trinca Publicidade</h1>
      <p>Cada cliente com a página e a planilha de acompanhamento.</p>
    </div>
    <dl>
      <div><dt>Clientes</dt><dd id="n-cli">7</dd></div>
      <div><dt>Com os dois links</dt><dd id="n-ambos">6</dd></div>
    </dl>
  </div>
</header>

<main class="in">

  <section aria-labelledby="cli-h">
    <div class="head"><h2 id="cli-h">Clientes</h2><span class="conta" id="cli-conta">Página · Planilha</span></div>
    <div class="status"><span id="status">Carregando a lista atualizada do Drive…</span><button type="button" class="btn" id="retry" hidden>Atualizar lista do Drive</button></div>
    <div class="grade" id="clientes"></div>
  </section>

  <section aria-labelledby="h-apoio">
    <div class="head"><h2 id="h-apoio">Outros links</h2></div>
    <div class="lista" id="apoio"></div>
  </section>

  <footer>Planilhas novas criadas na pasta ADVISORYS JOEL JOTA / TRINCA entram aqui sozinhas.</footer>
</main>

<script>
(function(){
  var MARCA="ADVISORY + A TRINCA PUBLICIDADE";
  // Um registro por cliente: nome, página, planilha (ID no Drive), programa, período, situação
  var CLIENTES=[
    {n:"Julio Pereira",pag:"https://jotaco-julio-pereira.netlify.app",id:"1oqHzJZWer6vFZ1BTwQjgGsFzRgtgOMIo-2frgjI9Opg",p:"Advisory Joel Jota + Plano estratégico + Diárias Jota Lab",d:"01/11/2026 → 30/04/2027",st:"Ativo"},
    {n:"Marina Takiuti",pag:"https://jotaco-marina-takiuti.netlify.app",id:"1tfrfV6uXymiUJ_EvMnmojfx1UmLiyuq4fRJeCFA6-Fw",p:"Advisory Joel Jota + Plano estratégico + Podcast CVFI + Diárias Jota Lab",d:"15/11/2026 → 15/05/2027",st:"Ativo"},
    {n:"André Nunes",pag:"https://jotaco-andre-nunes.netlify.app",id:"10aGSQWiLqw18L7V4Z4WKmn1JItH5aey90qqjUqc94NY",p:"GIGANTE · JJ Podcast + Advisory Joel Jota e Caio Carneiro + Talks + Diárias Jota Lab",d:"10/01/2027 → 10/07/2027",st:"Ativo"},
    {n:"Fernanda Tochetto",pag:"https://jotaco-fernanda-toqueto.netlify.app",id:"1wp2XRMryyTKDsXRrmqWJFcgRPWGTmLDtS7oNpfDkBgg",p:"Advisory Joel Jota + Plano estratégico + Podcast CVFI + Talks",d:"01/02/2027 → 31/07/2027",st:"Ativo"},
    {n:"Leandro Reche",pag:"https://jotaco-leandro-reche.netlify.app",id:"1jRWz7rxjjhkTLpn6gAh9W5OszyXdpubS1MP7IeGTIdg",p:"Advisory Joel Jota + Plano estratégico + JJ Podcast com Plateia",d:"datas a definir",st:"Ativo"},
    {n:"Isabela Soller",pag:"https://advisory-isabela-soller.netlify.app",id:"1P4j94RYNADasQ3U1gJh5J5iZNAxVRgvj7oPkKPcPvWA",p:"Advisory Joel Jota · combinados em andamento",d:"01/03/2026 → 31/08/2026",st:"Encerrado"},
    {n:"Ribana e João",pag:"https://claude.ai/artifact/6gPNokNgMkoULoW4dJfHjR",id:"",p:"Programa de Advisory",d:"",st:"Ativo"}
  ];
  var APOIO=[
    ["Trilho do Advisory","Passo a passo do Advisory","https://claude.ai/artifact/7iued6qcZtRUJLdnHn9Um1"],
    ["Pasta ADVISORYS JOEL JOTA / TRINCA","Todas as planilhas de acompanhamento no Drive","https://drive.google.com/drive/folders/1_1tXmbJZ3vbN8xogJrO2cY230eWmpn8h"]
  ];
  var SERVER="Google Drive", TOOL="search_files";
  var FOLDER="1_1tXmbJZ3vbN8xogJrO2cY230eWmpn8h";
  var SKIP={"1DanPvU0yaIqYILupXcQhQcJA88wRV07oQ31aka8O0jg":1};
  var INPUT={query:"parentId = '"+FOLDER+"' and mimeType = 'application/vnd.google-apps.spreadsheet' and trashed = false",
    pageSize:100, excludeContentSnippets:true, orderBy:"modifiedTime desc"};
  var $=function(id){return document.getElementById(id)};
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function link(cls,href,txt){var a=el("a",cls,txt);a.href=href;a.target="_blank";a.rel="noopener";return a;}
  function iniciais(n){var p=n.replace(/\b(e|de|da|do|dos|das)\b/gi," ").trim().split(/\s+/);return ((p[0]||"")[0]||"")+((p.length>1?p[p.length-1][0]:"")||"");}
  function nameFrom(t){
    var s=String(t||"").replace(/^\s*acompanhamento\s*[–—-]?\s*/i,"").replace(/\s*[-–—]\s*acompanhamento.*$/i,"").replace(/\s*\(.*\)\s*$/,"").trim();
    return s||String(t||"Novo cliente");
  }
  function fmt(iso){var d=new Date(iso);if(isNaN(d))return "";
    return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();}

  // outros links
  var ap=$("apoio");
  APOIO.forEach(function(x){
    var a=link("row",x[2]); var t=el("span","txt"); t.appendChild(el("span","nome",x[0])); t.appendChild(el("span","prog",x[1]));
    a.appendChild(t); a.appendChild(el("span","datas","")); a.appendChild(el("span","seta","→")); ap.appendChild(a);
  });

  // clientes: conhecidos + planilhas novas vindas do Drive
  var novos=[];
  function render(){
    var lista=novos.concat(CLIENTES), g=$("clientes"); g.replaceChildren();
    lista.forEach(function(c){
      var card=el("article","cli");
      var topo=el("div","topo"); var ini=el("span","ini",iniciais(c.n).toUpperCase()); ini.setAttribute("aria-hidden","true");
      var t=el("span","txt"); t.appendChild(el("span","nome",c.n)); t.appendChild(el("span","marca",MARCA));
      topo.appendChild(ini); topo.appendChild(t); card.appendChild(topo);
      if(c.p) card.appendChild(el("div","prog",c.p));
      var ln=el("div","linha"); ln.appendChild(el("span",c.novo?"pill new":(c.st==="Ativo"?"pill":"pill fim"),c.novo?"Novo":c.st));
      if(c.d) ln.appendChild(document.createTextNode(c.d)); card.appendChild(ln);
      var ac=el("div","acoes");
      ac.appendChild(c.pag?link("pag",c.pag,"Página →"):el("span","falta","Sem página"));
      ac.appendChild(c.id?link("pla","https://docs.google.com/spreadsheets/d/"+c.id+"/edit","Planilha →"):el("span","falta","Sem planilha"));
      card.appendChild(ac); g.appendChild(card);
    });
    $("n-cli").textContent=lista.length;
    $("n-ambos").textContent=lista.filter(function(c){return c.pag&&c.id;}).length;
  }
  render();

  var status=$("status"), retry=$("retry"), mcpRef=null;
  function payloadFiles(res){var p=res&&res.payload; if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){p=null}}
    return p&&Array.isArray(p.files)?p.files:null;}
  function stamp(res){var t=res&&res.cache&&res.cache.storedAt?new Date(res.cache.storedAt):new Date();
    return t.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}
  function onError(err){
    var c=err&&err.code;
    if(c==="needs_reauth"){status.textContent="Reconecte o Google Drive em claude.ai → Configurações → Conectores para ver planilhas novas. Mostrando a última lista salva.";}
    else if(c==="server_not_connected"||c==="selection_required"){status.textContent="Conecte o Google Drive em claude.ai → Configurações → Conectores para ver planilhas novas. Mostrando a última lista salva.";}
    else if(c==="approval_required"||c==="not_in_manifest"){status.textContent="Para a lista se atualizar sozinha, permita o acesso ao Google Drive.";retry.hidden=false;}
    else if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed"){status.textContent="Mostrando a última lista salva.";}
    else {status.textContent="Não consegui falar com o Google Drive agora. Mostrando a última lista salva.";retry.hidden=false;}
  }
  function onData(res){var f=payloadFiles(res); if(!f){status.textContent="Mostrando a última lista salva.";return;}
    var conhecidos={}; CLIENTES.forEach(function(c){if(c.id)conhecidos[c.id]=1;});
    novos=f.filter(function(x){return x&&x.id&&!SKIP[x.id]&&!conhecidos[x.id];})
      .sort(function(a,b){return (a.createdTime||"")<(b.createdTime||"")?1:-1;})
      .map(function(x){return {n:nameFrom(x.title),pag:"",id:x.id,p:x.title||"",d:"criada em "+fmt(x.createdTime),novo:true};});
    render(); retry.hidden=true; status.textContent="Lista atualizada do Drive · "+stamp(res);}
  retry.addEventListener("click",function(){
    if(!mcpRef)return; retry.hidden=true; status.textContent="Buscando no Drive…";
    mcpRef.callTool(SERVER,TOOL,INPUT,{cache:{refresh:true,staleTime:0,gcTime:3600000}}).then(onData,onError);
  });
  if(!window.claude||!window.claude.use){status.textContent="Mostrando a última lista salva.";return;}
  window.claude.use("mcp").then(function(mcp){
    if(!mcp){status.textContent="Mostrando a última lista salva.";return;}
    mcpRef=mcp;
    mcp.watchTool(SERVER,TOOL,INPUT,function(ev){ ev.type==="data"?onData(ev.result):onError(ev.error); },
      {cache:{staleTime:60000,gcTime:86400000},refetchInterval:300000});
    mcp.callTool(SERVER,TOOL,INPUT,{cache:{staleTime:60000,gcTime:86400000}}).then(onData,onError);
  },function(){status.textContent="Mostrando a última lista salva.";});
})();
</script>
